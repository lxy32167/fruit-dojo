<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#241b16"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="挥动指尖，切开好心情。适合触屏的经典 H5 切水果游戏。">
<title>水果道场 · Fruit Dojo</title>
<link rel="stylesheet" href="styles.css"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<main id="dojo">
<canvas id="game" aria-label="水果切割区域，按住鼠标或用手指划过水果，避开炸弹"></canvas>
<header class="topbar"><a class="brand" href="./" aria-label="水果道场首页"><span class="brand-mark">斩</span><span>水果道场<small>FRUIT DOJO</small></span></a><div class="tools"><button id="sound" class="icon-button" aria-label="关闭声音" title="声音">♪</button><button id="fullscreen" class="icon-button" aria-label="全屏" title="全屏">⛶</button><button id="help" class="icon-button" aria-label="玩法说明">?</button></div></header>
<section id="home" class="screen home">
<div class="eyebrow"><span></span> A LITTLE SLICE OF HAPPINESS <span></span></div>
<h1>一刀，<br><em>痛快。</em></h1><p class="intro">指尖出鞘，果汁四溅。<br>回到只想再来一局的时光。</p>
<div class="mode-picker" role="group" aria-label="游戏模式"><button class="mode active" data-mode="classic" aria-pressed="true"><span>经典模式</span><small>三次机会 · 小心炸弹</small></button><button class="mode" data-mode="zen" aria-pressed="false"><span>禅模式</span><small>90 秒 · 尽情切水果</small></button></div>
<button id="start" class="primary"><span>开始切水果</span><span class="arrow">↗</span></button>
<div class="home-best">个人最佳 <strong id="home-best">0</strong><span>分</span></div>
</section>
<div id="hud" hidden><div class="score-block"><span>本局得分</span><strong id="score">0</strong><small>最佳 <b id="best">0</b></small></div><div class="status-block"><span id="status-label">漏掉水果</span><div id="lives" aria-label="已漏掉 0 个水果"><i>×</i><i>×</i><i>×</i></div><strong id="timer" hidden>1:30</strong><button id="pause" class="pause-button">Ⅱ <span>暂停</span></button></div></div>
<div id="game-hint" hidden>按住并划过水果 · 一刀切中 3 个以上可获连击加分</div>
<footer id="footer"><span class="footer-line"></span><span>手指滑动 / 鼠标拖动</span><span class="footer-dot">·</span><span>横屏更尽兴</span><span class="footer-line"></span></footer>
<div id="toast" role="status"></div>
<div id="overlay" class="overlay" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><span id="dialog-kicker" class="dialog-kicker">TAKE A BREATH</span><h2 id="dialog-title">稍作休息</h2><div id="dialog-content"></div><button id="dialog-primary" class="primary">继续游戏 ↗</button><button id="dialog-secondary" class="secondary">返回道场</button></section></div>
</main><script type="module" src="game.js"></script>
</body></html>
